name: Weekly growth KPI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/growth-kpi.yml'
      - 'data/kpi-config.json'
      - 'data/demand-operation.json'
      - 'data/demand-signals.json'
      - 'scripts/collect-growth-kpis.mjs'
      - 'scripts/plan-demand-operation.mjs'
      - 'scripts/fetch-official-safety-signals.mjs'
      - 'scripts/test-growth-kpis.mjs'
      - 'scripts/test-demand-operation.mjs'
      - 'scripts/test-official-safety-signals.mjs'
  schedule:
    - cron: '0 22 * * 1'

concurrency:
  group: weekly-growth-kpi
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check KPI credentials
        id: configured
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_KPI_SHEET_ID: ${{ secrets.GOOGLE_KPI_SHEET_ID }}
        shell: bash
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" && service_account=true || service_account=false
          test -n "$GA4_PROPERTY_ID" && ga4_property=true || ga4_property=false
          test -n "$GOOGLE_KPI_SHEET_ID" && sheet=true || sheet=false
          echo "service_account=$service_account" >> "$GITHUB_OUTPUT"
          echo "ga4_property=$ga4_property" >> "$GITHUB_OUTPUT"
          echo "sheet=$sheet" >> "$GITHUB_OUTPUT"
          if [ "$service_account" = true ] && [ "$ga4_property" = true ] && [ "$sheet" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test KPI, demand planner and safety feed
        run: node --test scripts/test-growth-kpis.mjs scripts/test-demand-operation.mjs scripts/test-official-safety-signals.mjs
      - name: Collect GA4 and Search Console KPI
        if: steps.configured.outputs.ready == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_KPI_SHEET_ID: ${{ secrets.GOOGLE_KPI_SHEET_ID }}
          SEARCH_CONSOLE_SITE_URL: https://jigyousho-bousai.com/
          KPI_OUTPUT_PATH: ${{ runner.temp }}/growth-kpi.json
        run: node scripts/collect-growth-kpis.mjs
      - name: Fetch official JMA safety signals
        if: steps.configured.outputs.ready == 'true'
        env:
          OFFICIAL_SIGNAL_PATH: ${{ runner.temp }}/official-safety-signals.json
        run: node scripts/fetch-official-safety-signals.mjs "$OFFICIAL_SIGNAL_PATH"
      - name: Select one demand action and save private drafts
        if: steps.configured.outputs.ready == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_KPI_SHEET_ID: ${{ secrets.GOOGLE_KPI_SHEET_ID }}
          KPI_OUTPUT_PATH: ${{ runner.temp }}/growth-kpi.json
          OFFICIAL_SIGNAL_PATH: ${{ runner.temp }}/official-safety-signals.json
        run: node scripts/plan-demand-operation.mjs "$KPI_OUTPUT_PATH"
      - name: Remove temporary KPI data
        if: always()
        shell: bash
        run: rm -f "${{ runner.temp }}/growth-kpi.json" "${{ runner.temp }}/official-safety-signals.json"
      - name: Report connection status
        if: always()
        shell: bash
        run: |
          {
            echo "## Weekly KPI connection"
            echo "- Service account: ${{ steps.configured.outputs.service_account }}"
            echo "- GA4 property ID: ${{ steps.configured.outputs.ga4_property }}"
            echo "- Private Google Sheet: ${{ steps.configured.outputs.sheet }}"
            echo "- Threads publishing: disabled (drafts only)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Missing service account credential
        if: always() && steps.configured.outputs.service_account != 'true'
        run: |
          echo "::error::Add GOOGLE_SERVICE_ACCOUNT_JSON to repository Actions secrets."
          exit 1
      - name: Missing GA4 property ID
        if: always() && steps.configured.outputs.ga4_property != 'true'
        run: |
          echo "::error::Add GA4_PROPERTY_ID to repository Actions secrets."
          exit 1
      - name: Missing private Google Sheet ID
        if: always() && steps.configured.outputs.sheet != 'true'
        run: |
          echo "::error::Add GOOGLE_KPI_SHEET_ID to repository Actions secrets."
          exit 1
