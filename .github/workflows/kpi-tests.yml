name: KPI and demand operation checks

on:
  pull_request:
    paths:
      - '.github/workflows/kpi-tests.yml'
      - '.github/workflows/growth-kpi.yml'
      - 'data/kpi-config.json'
      - 'data/demand-operation.json'
      - 'data/demand-signals.json'
      - 'scripts/collect-growth-kpis.mjs'
      - 'scripts/plan-demand-operation.mjs'
      - 'scripts/fetch-official-safety-signals.mjs'
      - 'scripts/test-growth-kpis.mjs'
      - 'scripts/test-demand-operation.mjs'
      - 'scripts/test-official-safety-signals.mjs'
      - 'scripts/generate-site.js'
      - 'scripts/fetch-products.js'
      - 'scripts/comparison-unit.js'
      - 'scripts/browser-check.mjs'
      - 'scripts/amazon-links.cjs'
      - 'scripts/test-amazon-links.mjs'
      - 'data/amazon-links.json'
      - 'package.json'
      - 'scripts/test-product-fit.mjs'
      - 'scripts/verify-site.js'
      - 'scripts/sync-public.js'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Verify patched Node.js runtime
        run: |
          node -e "const expected = '24.22.1'; if (process.versions.node !== expected) throw new Error('Expected Node.js ' + expected + ', got ' + process.versions.node); console.log('Verified Node.js ' + process.versions.node);"
      - name: Test KPI collector and demand planner
        run: node --test scripts/test-growth-kpis.mjs scripts/test-demand-operation.mjs scripts/test-official-safety-signals.mjs
      - name: Verify live JMA safety feed
        env:
          OFFICIAL_SIGNAL_PATH: ${{ runner.temp }}/official-safety-signals.json
        run: node scripts/fetch-official-safety-signals.mjs "$OFFICIAL_SIGNAL_PATH"
      - name: Build generated site
        run: npm run build
      - name: Prepare generated public files for verification
        run: npm run sync:public
      - name: Run complete verification
        run: npm run verify
      - name: Run browser verification
        run: npm run verify:browser
