name: Update affiliate site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/keywords.csv'
      - 'data/paid-product.json'
      - 'data/indexnow.json'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '0 21 * * 0'

permissions:
  contents: write
  pages: write

concurrency:
  group: affiliate-site-weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh products and verify generated site
        run: npm run update
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          SITE_URL: https://jigyousho-bousai.com
          REFRESH_MAX_AGE_HOURS: 12
      - name: Verify browser output and generated diff
        run: |
          npm run verify:browser
          git diff --check
      - name: Reject unexpected generated changes
        shell: bash
        run: |
          unexpected="$(
            git status --porcelain | sed -E 's/^.. //' | while IFS= read -r path; do
              case "$path" in
                data/products.json|deploy-status.json|index.html|site-policy.html|sitemap.xml|robots.txt|CNAME|404.html|google*.html|pages/*|topics/*|assets/*|downloads/*) ;;
                *) printf '%s\n' "$path" ;;
              esac
            done
          )"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi
      - name: Publish generated files
        id: publish
        run: |
          git config user.name "Jigyousho Bousai Navi Editorial"
          git config user.email "bousai-navi@users.noreply.github.com"
          git add -A -- data/products.json deploy-status.json index.html site-policy.html sitemap.xml robots.txt CNAME pages topics assets downloads
          if git diff --cached --quiet; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "No changes"
          else
            git commit -m "Update generated affiliate pages"
            git push
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Request GitHub Pages build
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      - name: Notify IndexNow
        if: steps.publish.outputs.published == 'true'
        run: node scripts/submit-indexnow.js
